function randomUrlSafe(bytes=48){const a=new Uint8Array(bytes);crypto.getRandomValues(a);return Array.from(a,b=>('0'+b.toString(16)).slice(-2)).join('')}
function base64url(buf){let s='';new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function beginLogin(){
 const verifier=randomUrlSafe(48),stateVal=randomUrlSafe(24);
 const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));
 const challenge=base64url(digest);
 sessionStorage.setItem('pkce_code_verifier',verifier);sessionStorage.setItem('oauth_state',stateVal);
 const q=new URLSearchParams({client_id:CLIENT_ID,redirect_uri:REDIRECT_URI,response_type:'code',scope:'',state:stateVal,code_challenge:challenge,code_challenge_method:'S256'});
 window.location.href=API+'/oauth/authorize?'+q.toString();
}
async function finishLoginIfNeeded(){
 if(window.location.pathname!='/auth/callback')return false;
 setSync('🔐 Finishing sign-in…');
 const q=new URLSearchParams(window.location.search),err=q.get('error');
 if(err){showAuth('Sign-in was cancelled or failed. Please try again.');history.replaceState({},'', '/');return true}
 const code=q.get('code'),returned=q.get('state'),expected=sessionStorage.getItem('oauth_state'),verifier=sessionStorage.getItem('pkce_code_verifier');
 if(!code||!returned||!expected||returned!==expected||!verifier){sessionStorage.removeItem('oauth_state');sessionStorage.removeItem('pkce_code_verifier');showAuth('Sign-in verification failed. Please try again.');history.replaceState({},'', '/');return true}
 try{

 }catch(e){showAuth('Could not finish sign-in. Please try again.');history.replaceState({},'', '/');return true}
}
async function refreshToken(){
 if(refreshPromise)return refreshPromise;
 refreshPromise=(async()=>{const rt=localStorage.getItem('refresh_token');if(!rt)throw new Error('no refresh token');

  const d=await r.json();if(!r.ok||!d.access_token)throw new Error('refresh failed');localStorage.setItem('access_token',d.access_token);localStorage.setItem('refresh_token',d.refresh_token);return d.access_token;
 })().finally(()=>refreshPromise=null);return refreshPromise;
}
async function apiFetch(path,options={},retry=true){
 let token=localStorage.getItem('access_token');if(!token)throw new Error('AUTH_REQUIRED');

 return r;

}

function disconnectRealtime(){if(pusher){try{pusher.disconnect()}catch(e){}}pusher=null;channel=null}

 disconnectRealtime();const accessToken=localStorage.getItem('access_token');if(!accessToken)return;
 pusher=new Pusher(PUSHER_KEY,{wsHost:PUSHER_HOST,wsPort:443,wssPort:443,forceTLS:true,enabledTransports:['ws','wss'],cluster:'mt1',authorizer:(ch)=>({authorize:async(socketId,callback)=>{try{const r=await apiFetch('/broadcasting/auth',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({socket_id:socketId,channel_name:ch.name})});const d=await r.json();if(!r.ok)throw d;callback(false,d)}catch(e){callback(true,e)}}})});

}

function dayDiff(a,b){const A=new Date(a+'T12:00:00'),B=new Date(b+'T12:00:00');return Math.round((B-A)/86400000)}
function customVisibleOn(x,ds){
 if(x.scope==='always')return !x.date||ds>=x.date;

 return false;
}
function visibleCustom(ds,category,classId){return customData().filter(x=>x.category===category&&(!classId||x.classId===classId)&&customVisibleOn(x,ds))}
function customLabel(x){return x.name+(x.due?' · Due '+x.due:'')}
function customBox(ds,x){return box(ds,'custom-'+x.id,customLabel(x),true)}
function renderCustomList(ds,category,targetId){const arr=visibleCustom(ds,category);const el=$(targetId);if(!arr.length){if(category==='homework'){el.className='none home-list';el.textContent='None'}return}el.className='home-list';el.innerHTML=arr.map(x=>box(ds,'custom-'+x.id,customLabel(x),true)).join('')}
function manager(){const el=$('customManager'),arr=customData(); if(!arr.length){el.innerHTML='<small>No added items yet.</small>';return} el.innerHTML='<b>Saved items</b>'+arr.map(x=>`<div style="display:flex;gap:6px;align-items:center;border-top:1px solid #ddd;padding:7px 0"><span style="flex:1;font-size:12px">${x.name}</span><button type="button" onclick="editCustom(\'${x.id}\')">Edit</button><button type="button" onclick="removeCustom(\'${x.id}\')">Delete</button></div>`).join('')}
let editingId=null;
function editCustom(id){const x=customData().find(i=>i.id===id);if(!x)return;editingId=id;$('editdate').value=x.date||iso(target());$('editcategory').value=x.category;$('editclass').value=x.classId||'ela';$('edittext').value=x.name;$('editscope').value=x.scope||'date';$('editend').value=x.end||'';$('editdue').value=x.due||'';editorVisibility();}
async function removeCustom(id){state.__custom.items=customData().filter(x=>x.id!==id);localStorage.setItem('jason-v3',JSON.stringify(state));manager();render();setSync('☁️ Saving…');try{await postState()}catch(e){if(e.message!=='AUTH_REQUIRED')setSync('⚠️ Saved on this phone only')}}
async function addCustom(){const name=$('edittext').value.trim();if(!name)return;const category=$('editcategory').value,ds=$('editdate').value||iso(target()),scope=$('editscope').value,classId=category==='class'?$('editclass').value:null,end=$('editend').value||null,due=$('editdue').value||null;const obj={id:editingId||Date.now().toString(36),name,category,classId,date:ds,scope,end,due};if(editingId){const n=customData().findIndex(x=>x.id===editingId);if(n>=0)state.__custom.items[n]=obj}else customData().push(obj);editingId=null;$('edittext').value='';$('editend').value='';$('editdue').value='';$('editor').classList.remove('show');localStorage.setItem('jason-v3',JSON.stringify(state));render();setSync('☁️ Saving…');try{await postState()}catch(e){if(e.message!=='AUTH_REQUIRED')setSync('⚠️ Saved on this phone only')}}
function editorVisibility(){$('classpick').style.display=$('editcategory').value==='class'?'block':'none';$('endpick').style.display=$('editscope').value==='range'?'block':'none';manager()}
function setupAdmin(){const q=new URLSearchParams(location.search);if(q.get('admin')==='1')localStorage.setItem('jason-admin','1');if(q.get('admin')==='0')localStorage.removeItem('jason-admin');const on=localStorage.getItem('jason-admin')==='1';$('adminbar').classList.toggle('show',on);$('editbtn').onclick=()=>{editingId=null;$('editdate').value=iso(target());$('editor').classList.toggle('show');editorVisibility()};$('cancelEdit').onclick=()=>{$('editor').classList.remove('show');editingId=null};$('saveEdit').onclick=addCustom;$('editcategory').onchange=editorVisibility;$('editscope').onchange=editorVisibility}
function mondayOf(ds){const d=new Date(ds+'T12:00:00'),n=d.getDay(),delta=n===0?-6:1-n;d.setDate(d.getDate()+delta);return iso(d)}
function firstClassDateThisWeek(ds,classId){let d=new Date(mondayOf(ds)+'T12:00:00');for(let i=0;i<7;i++){const x=iso(d),s=scheduleFor(x);if(s.classes.some(c=>c.id===classId))return x;d.setDate(d.getDate()+1)}return null}
function builtInHomework(ds,s){const a=[];if(s.school)a.push({id:'ela-reading',name:'📚 ELA · Read 15 min + Reading Log'});if(s.classes.some(c=>c.id==='ela')&&firstClassDateThisWeek(ds,'ela')===ds)a.push({id:'ela-log',name:'📝 ELA · Turn in Reading Log + Get new form'});return a}
function render(){const d=target(),ds=iso(d),s=scheduleFor(ds);$('today').classList.toggle('active',offset===0);$('tomorrow').classList.toggle('active',offset===1);$('date').textContent=(d.getMonth()+1).toString().padStart(2,'0')+'/'+d.getDate().toString().padStart(2,'0')+'/'+String(d.getFullYear()).slice(2)+' · '+d.toLocaleDateString('en-US',{weekday:'long'});$('day').textContent=s.label;$('day').classList.toggle('late',CALENDAR[ds]==='LATE');renderWeather(ds,s);$('schooltime').textContent=s.school?`🏫 ${s.start}  •  🚗 ${s.pickup} · Office Pickup`:'';const di=dailyItems(ds,s);$('daily').style.display=di.length?'grid':'none';$('daily').innerHTML=di.length?di.map(i=>box(ds,'daily-'+i.id,i.name,true)).join(''):'';$('classes').innerHTML=s.classes.length?s.classes.map(c=>box(ds,'class-'+c.id,c.name)+c.items.map(i=>box(ds,'item-'+c.id+'-'+i.id,i.name,true)).join('')+visibleCustom(ds,'class',c.id).map(x=>customBox(ds,x)).join('')).join(''):'<div class="home">No classes scheduled</div>';const bh=builtInHomework(ds,s),ch=visibleCustom(ds,'homework');const he=$('homework');if(!bh.length&&!ch.length){he.className='none home-list';he.textContent='None'}else{he.className='home-list';he.innerHTML=bh.map(x=>box(ds,'builtin-'+x.id,x.name,true)).join('')+ch.map(x=>box(ds,'custom-'+x.id,customLabel(x),true)).join('')}const todos=visibleCustom(ds,'todo');$('returns').style.display=todos.length?'block':'none';$('returnItems').innerHTML=todos.map(x=>box(ds,'custom-'+x.id,x.name,true)).join('');document.querySelectorAll('.cb').forEach(x=>x.onchange=()=>save(x.dataset.k,x.checked))}
async function start(){setupAdmin();render();loadWeather();$("login").onclick=beginLogin;await finishLoginIfNeeded();if(!localStorage.getItem('access_token')){showAuth();state=JSON.parse(localStorage.getItem('jason-v3')||'{}');render();return}hideAuth();await fetchLatest();connectRealtime()}
$("today").onclick=()=>{offset=0;render()};$("tomorrow").onclick=()=>{offset=1;render()};start();
</script></body></html>
